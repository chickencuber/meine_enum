[package]
name = "meine_enum_proc"
version = "0.2.0"
edition = "2024"


license = "MIT"
authors = ["chickencuber"]
repository = "https://github.com/chickencuber/meine_enum"
description = "just a bunch of enum based helpers"

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1.0"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
standard = [] #standard is not default because f*ck you thats why
test = []
